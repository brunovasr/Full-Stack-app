<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Tarefas - Aplicação em Nuvem</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    ul { padding: 0; list-style: none; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
    .feita span { text-decoration: line-through; color: #888; }
    footer { margin-top: 32px; font-size: .8rem; color: #666; }
  </style>
</head>
<body>
  <h1>Lista de Tarefas</h1>
  <form id="form">
    <input id="titulo" placeholder="Nova tarefa" required>
    <button>Adicionar</button>
  </form>
  <ul id="lista"></ul>
  <footer>Aplicação web publicada em plataforma de computação em nuvem (Microsoft Azure) — Ambientes de Desenvolvimento de Software, UNIFOR.</footer>

  <script>
    // As tarefas ficam salvas no próprio navegador (localStorage).
    const CHAVE = 'tarefas';
    const lista = document.getElementById('lista');

    function ler() {
      try { return JSON.parse(localStorage.getItem(CHAVE)) || []; }
      catch (e) { return []; }
    }
    function salvar(tarefas) {
      try { localStorage.setItem(CHAVE, JSON.stringify(tarefas)); } catch (e) {}
    }

    function render() {
      const tarefas = ler();
      lista.innerHTML = '';
      tarefas.forEach(t => {
        const li = document.createElement('li');
        if (t.concluida) li.className = 'feita';
        const span = document.createElement('span');
        span.textContent = t.titulo;
        const acoes = document.createElement('div');
        const bAlt = document.createElement('button');
        bAlt.textContent = '✔';
        bAlt.onclick = () => {
          const todas = ler();
          const alvo = todas.find(x => x.id === t.id);
          if (alvo) alvo.concluida = !alvo.concluida;
          salvar(todas); render();
        };
        const bDel = document.createElement('button');
        bDel.textContent = '✖';
        bDel.onclick = () => { salvar(ler().filter(x => x.id !== t.id)); render(); };
        acoes.append(bAlt, ' ', bDel);
        li.append(span, acoes);
        lista.appendChild(li);
      });
    }

    document.getElementById('form').onsubmit = e => {
      e.preventDefault();
      const titulo = document.getElementById('titulo').value.trim();
      if (!titulo) return;
      const tarefas = ler();
      tarefas.push({ id: Date.now(), titulo, concluida: false });
      salvar(tarefas);
      e.target.reset();
      render();
    };

    render();
  </script>
</body>
</html>
