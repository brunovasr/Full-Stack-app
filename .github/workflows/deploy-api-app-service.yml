name: Deploy da API no Azure App Service

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-api-app-service.yml']
  workflow_dispatch:

jobs:
  testar_e_publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências e rodar testes
        run: |
          npm --prefix backend ci || npm --prefix backend install
          npm --prefix backend test
      - name: Instalar somente dependências de produção
        run: npm --prefix backend install --omit=dev
      - name: Publicar no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
